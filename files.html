<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RemixBay - Files</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: #eeeeee;
            color: #222222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .page {
            width: 900px;
            margin: 20px auto;
            background: white;
            border: 1px solid #aaaaaa;
        }

        .header {
            background: #3b5998;
            color: white;
            padding: 10px 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: normal;
        }

        .navigation {
            background: #eeeeee;
            border-bottom: 1px solid #bbbbbb;
            padding: 7px 10px;
        }

        .navigation a {
            color: #003399;
            text-decoration: none;
            margin-right: 15px;
        }

        .navigation a:hover {
            text-decoration: underline;
        }

        .content {
            padding: 15px;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
            font-weight: normal;
        }

        .search {
            background: #f5f5f5;
            border: 1px solid #cccccc;
            padding: 8px;
            margin-bottom: 10px;
        }

        .search input {
            width: 300px;
            padding: 5px;
            border: 1px solid #999999;
            font-family: Arial, Helvetica, sans-serif;
        }

        .search button {
            padding: 5px 10px;
            margin-left: 4px;
            border: 1px solid #888888;
            background: #eeeeee;
            cursor: pointer;
        }

        .search button:hover {
            background: #dddddd;
        }

        .search-info {
            margin-top: 7px;
            color: #666666;
            font-size: 12px;
        }

        .path {
            background: #f5f5f5;
            border: 1px solid #cccccc;
            padding: 7px;
            margin-bottom: 10px;
            font-family: "Courier New", monospace;
            font-size: 13px;
        }

        .back {
            margin-bottom: 10px;
        }

        .back a {
            color: #003399;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #dddddd;
            border: 1px solid #bbbbbb;
            padding: 6px;
            text-align: left;
            font-weight: bold;
        }

        td {
            border-bottom: 1px solid #dddddd;
            padding: 6px;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .name {
            width: auto;
        }

        .size {
            width: 100px;
            color: #555555;
        }

        .type {
            width: 80px;
            color: #555555;
        }

        .actions {
            width: 130px;
        }

        a {
            color: #003399;
        }

        .folder a {
            font-weight: bold;
        }

        .loading {
            padding: 15px;
            border: 1px solid #cccccc;
            background: #fafafa;
        }

        .empty {
            padding: 15px;
            border: 1px solid #cccccc;
            background: #fafafa;
        }

        .footer {
            border-top: 1px solid #bbbbbb;
            background: #eeeeee;
            padding: 10px;
            color: #666666;
            font-size: 12px;
        }

    </style>

</head>


<body>


<div class="page">


    <div class="header">

        <h1>RemixBay</h1>

    </div>


    <div class="navigation">

        <a href="index.html">Home</a>

        <a href="files.html">Files</a>

        <a href="about.html">About</a>

    </div>


    <div class="content">

        <h2>File Archive</h2>


        <!-- SEARCH -->

        <div class="search">

            Search:

            <input
                type="text"
                id="searchInput"
                placeholder="Search filenames...">

            <button onclick="searchFiles()">
                Search
            </button>

            <button onclick="clearSearch()">
                Clear
            </button>

            <div
                class="search-info"
                id="searchInfo">
            </div>

        </div>


        <div class="path" id="path">
            /
        </div>


        <div class="back" id="back">

            <a href="#"
               onclick="goBack(); return false;">

                &lt; Parent Directory

            </a>

        </div>


        <div id="loading"
             class="loading">

            Loading files...

        </div>


        <div id="fileArea"></div>

    </div>


    <div class="footer">

        RemixBay File Archive

    </div>


</div>


<script>


const API_URL = "/api/files";


let allFiles = [];

let currentPath = "";

let searchMode = false;


const loading =
    document.getElementById("loading");

const fileArea =
    document.getElementById("fileArea");

const pathDisplay =
    document.getElementById("path");

const back =
    document.getElementById("back");

const searchInput =
    document.getElementById("searchInput");

const searchInfo =
    document.getElementById("searchInfo");



/*
    Load files from Worker
*/


fetch(API_URL)

    .then(response => response.json())

    .then(files => {

        allFiles = files;

        loading.style.display = "none";

        showFolder("");

    })

    .catch(error => {

        loading.innerText =
            "Error loading files.";

        console.log(error);

    });



/*
    Display a normal folder
*/


function showFolder(path) {


    searchMode = false;

    currentPath = path;


    pathDisplay.innerText =
        "/" + path;


    searchInfo.innerText =
        "";


    fileArea.innerHTML = "";


    if (path === "") {

        back.style.display = "none";

    } else {

        back.style.display = "block";

    }


    const folders = {};

    const files = [];


    allFiles.forEach(file => {


        if (!file.name.startsWith(path)) {
            return;
        }


        let remaining =
            file.name.substring(path.length);


        if (remaining.startsWith("/")) {

            remaining =
                remaining.substring(1);

        }


        if (remaining === "") {
            return;
        }


        const slash =
            remaining.indexOf("/");


        if (slash !== -1) {

            const folderName =
                remaining.substring(0, slash);

            folders[folderName] = true;

        }

        else {

            files.push(file);

        }

    });


    displayResults(
        folders,
        files
    );

}



/*
    Search all files
*/


function searchFiles() {


    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    if (search === "") {

        showFolder(currentPath);

        return;

    }


    searchMode = true;


    pathDisplay.innerText =
        "/ Search Results";


    back.style.display =
        "none";


    fileArea.innerHTML = "";


    const matchingFiles =
        allFiles.filter(file =>

            file.name
                .toLowerCase()
                .includes(search)

        );


    searchInfo.innerText =
        matchingFiles.length +
        " matching file(s) found.";


    displaySearchResults(
        matchingFiles
    );

}



/*
    Display search results
*/


function displaySearchResults(files) {


    if (files.length === 0) {

        fileArea.innerHTML =
            '<div class="empty">' +
            'No files found.' +
            '</div>';

        return;

    }


    const table =
        document.createElement("table");


    table.innerHTML = `

        <tr>

            <th class="name">Name</th>

            <th class="size">Size</th>

            <th class="type">Type</th>

            <th class="actions">Actions</th>

        </tr>

    `;


    files.sort((a, b) =>
        a.name.localeCompare(b.name)
    );


    files.forEach(file => {

        table.appendChild(
            createFileRow(file)
        );

    });


    fileArea.appendChild(table);

}



/*
    Display folder contents
*/


function displayResults(
    folders,
    files
) {


    const table =
        document.createElement("table");


    table.innerHTML = `

        <tr>

            <th class="name">Name</th>

            <th class="size">Size</th>

            <th class="type">Type</th>

            <th class="actions">Actions</th>

        </tr>

    `;


    Object.keys(folders)
        .sort()
        .forEach(folderName => {


            const row =
                document.createElement("tr");


            row.className =
                "folder";


            const link =
                document.createElement("a");


            link.href = "#";

            link.innerText =
                folderName + "/";


            link.onclick =
                function() {

                    openFolder(
                        folderName
                    );

                    return false;

                };


            const nameCell =
                document.createElement("td");


            nameCell.appendChild(
                document.createTextNode("📁 ")
            );


            nameCell.appendChild(link);


            row.appendChild(nameCell);


            row.innerHTML += `

                <td>-</td>

                <td>Folder</td>

                <td>-</td>

            `;


            table.appendChild(row);

        });


    files.sort((a, b) =>
        a.name.localeCompare(b.name)
    );


    files.forEach(file => {

        table.appendChild(
            createFileRow(file)
        );

    });


    if (
        Object.keys(folders).length === 0 &&
        files.length === 0
    ) {

        fileArea.innerHTML =
            '<div class="empty">' +
            'This directory is empty.' +
            '</div>';

        return;

    }


    fileArea.appendChild(table);

}



/*
    Create a file row
*/


function createFileRow(file) {


    const row =
        document.createElement("tr");


    const parts =
        file.name.split("/");


    const name =
        parts[parts.length - 1];


    const extension =
        name
            .split(".")
            .pop()
            .toLowerCase();


    let icon = "📄";

    let type = "File";


    if (extension === "mp3") {

        icon = "🎵";

        type = "MP3";

    }

    else if (extension === "mp4") {

        icon = "🎬";

        type = "MP4";

    }

    else if (extension === "flp") {

        icon = "🎹";

        type = "FLP";

    }

    else if (extension === "zip") {

        icon = "📦";

        type = "ZIP";

    }


    const nameCell =
        document.createElement("td");


    nameCell.innerText =
        icon + " ";


    const fileLink =
        document.createElement("a");


    fileLink.href =
        file.url;

    fileLink.target =
        "_blank";

    fileLink.innerText =
        name;


    nameCell.appendChild(
        fileLink
    );


    row.appendChild(
        nameCell
    );


    row.innerHTML += `

        <td>${file.size}</td>

        <td>${type}</td>

        <td></td>

    `;


    const actionCell =
        row.lastElementChild;


    if (
        extension === "mp3" ||
        extension === "mp4"
    ) {

        const play =
            document.createElement("a");


        play.href =
            "player.html?file=" +
            encodeURIComponent(file.url);


        play.innerText =
            "Play";


        actionCell.appendChild(
            play
        );


        actionCell.appendChild(
            document.createTextNode(" ")
        );

    }


    const download =
        document.createElement("a");


    download.href =
        file.url;

    download.target =
        "_blank";

    download.innerText =
        "Download";


    actionCell.appendChild(
        download
    );


    return row;

}



/*
    Open folder
*/


function openFolder(folder) {

    showFolder(
        currentPath +
        folder +
        "/"
    );

}



/*
    Go back
*/


function goBack() {


    if (currentPath === "") {
        return;
    }


    let parts =
        currentPath
            .split("/")
            .filter(Boolean);


    parts.pop();


    let newPath =
        parts.join("/");


    if (newPath !== "") {

        newPath += "/";

    }


    showFolder(
        newPath
    );

}



/*
    Clear search
*/


function clearSearch() {


    searchInput.value =
        "";


    searchInfo.innerText =
        "";


    showFolder(
        currentPath
    );

}



/*
    Press Enter to search
*/


searchInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchFiles();

        }

    }
);


</script>


</body>

</html>
