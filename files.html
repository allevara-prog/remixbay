<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Files</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: #eeeeee;
            color: #222222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .page {
            width: 900px;
            margin: 20px auto;
            background: white;
            border: 1px solid #aaaaaa;
        }

        .header {
            background: #3b5998;
            color: white;
            padding: 10px 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: normal;
        }

        .navigation {
            background: #eeeeee;
            border-bottom: 1px solid #bbbbbb;
            padding: 7px 10px;
        }

        .navigation a {
            color: #003399;
            text-decoration: none;
            margin-right: 15px;
        }

        .navigation a:hover {
            text-decoration: underline;
        }

        .content {
            padding: 15px;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
            font-weight: normal;
        }

        .search {
            background: #f5f5f5;
            border: 1px solid #cccccc;
            padding: 8px;
            margin-bottom: 10px;
        }

        .search input {
            width: 300px;
            padding: 5px;
            border: 1px solid #999999;
            font-family: Arial, Helvetica, sans-serif;
        }

        .search button {
            padding: 5px 10px;
            margin-left: 4px;
            border: 1px solid #888888;
            background: #eeeeee;
            cursor: pointer;
        }

        .search button:hover {
            background: #dddddd;
        }

        .search-info {
            margin-top: 7px;
            color: #666666;
            font-size: 12px;
        }

        .path {
            background: #f5f5f5;
            border: 1px solid #cccccc;
            padding: 7px;
            margin-bottom: 10px;
            font-family: "Courier New", monospace;
            font-size: 13px;
        }

        .back {
            margin-bottom: 10px;
        }

        .back a {
            color: #003399;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #dddddd;
            border: 1px solid #bbbbbb;
            padding: 6px;
            text-align: left;
            font-weight: bold;
        }

        td {
            border-bottom: 1px solid #dddddd;
            padding: 6px;
            vertical-align: top;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .name {
            width: auto;
        }

        .size {
            width: 90px;
            color: #555555;
        }

        .type {
            width: 70px;
            color: #555555;
        }

        .actions {
            width: 130px;
        }

        a {
            color: #003399;
        }

        .folder a {
            font-weight: bold;
        }

        .file-info {
            margin-top: 3px;
            margin-left: 23px;
            color: #666666;
            font-size: 11px;
        }

        .file-info a {
            font-size: 11px;
        }

        .loading {
            padding: 15px;
            border: 1px solid #cccccc;
            background: #fafafa;
        }

        .empty {
            padding: 15px;
            border: 1px solid #cccccc;
            background: #fafafa;
        }

        .footer {
            border-top: 1px solid #bbbbbb;
            background: #eeeeee;
            padding: 10px;
            color: #666666;
            font-size: 12px;
        }

        /*
            Make the site usable
            on smaller screens
        */

        @media (max-width: 930px) {

            .page {
                width: auto;
                margin: 10px;
            }

            .search input {
                width: 50%;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <div class="header">

        <h1>RemixBay</h1>

    </div>

    <div class="navigation">

        <a href="index.html">Home</a>

        <a href="files.html">Files</a>

        <a href="about.html">About</a>

    </div>

    <div class="content">

        <h2>Files</h2>

        <!-- SEARCH -->

        <div class="search">

            Search:

            <input
                type="text"
                id="searchInput"
                placeholder="Search file names, base, year, etc.">

            <button onclick="searchFiles()">
                Search
            </button>

        

            <div
                class="search-info"
                id="searchInfo">
            </div>

        </div>

        <!-- CURRENT DIRECTORY -->

        <div class="path" id="path">
            /
        </div>

        <!-- PARENT DIRECTORY -->

        <div class="back" id="back">

            <a href="#"
               onclick="goBack(); return false;">

                ...

            </a>

        </div>

        <!-- LOADING -->

        <div
            id="loading"
            class="loading">

            Loading files...

        </div>

        <!-- FILES -->

        <div id="fileArea"></div>

    </div>

    <div class="footer">



    </div>

</div>

<script>

const API_URL = "/api/files";

let allFiles = [];

let currentPath = "";

const loading =
    document.getElementById("loading");

const fileArea =
    document.getElementById("fileArea");

const pathDisplay =
    document.getElementById("path");

const back =
    document.getElementById("back");

const searchInput =
    document.getElementById("searchInput");

const searchInfo =
    document.getElementById("searchInfo");

/*
    LOAD FILES
*/

fetch(API_URL)

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "API returned " +
                response.status
            );

        }

        return response.json();

    })

    .then(files => {

        allFiles = files;

        loading.style.display =
            "none";

        showFolder("");

    })

    .catch(error => {

        loading.innerText =
            "Error loading files.";

        console.log(error);

    });

/*
    DISPLAY DIRECTORY
*/

function showFolder(path) {

    currentPath = path;

    pathDisplay.innerText =
        "/" + path;

    searchInfo.innerText =
        "";

    fileArea.innerHTML =
        "";

    if (path === "") {

        back.style.display =
            "none";

    }

    else {

        back.style.display =
            "block";

    }

    const folders = {};

    const files = [];

    allFiles.forEach(file => {

        if (!file.name.startsWith(path)) {

            return;

        }

        let remaining =
            file.name.substring(
                path.length
            );

        if (remaining.startsWith("/")) {

            remaining =
                remaining.substring(1);

        }

        if (remaining === "") {

            return;

        }

        const slash =
            remaining.indexOf("/");

        /*
            Folder
        */

        if (slash !== -1) {

            const folderName =
                remaining.substring(
                    0,
                    slash
                );

            folders[folderName] =
                true;

        }

        /*
            File
        */

        else {

            files.push(file);

        }

    });

    displayResults(
        folders,
        files
    );

}

/*
    DISPLAY NORMAL DIRECTORY
*/

function displayResults(
    folders,
    files
) {

    if (
        Object.keys(folders).length === 0 &&
        files.length === 0
    ) {

        fileArea.innerHTML =
            '<div class="empty">' +
            'This directory is empty.' +
            '</div>';

        return;

    }

    const table =
        createTable();

    /*
        FOLDERS
    */

    Object.keys(folders)

        .sort()

        .forEach(folderName => {

            const row =
                document.createElement("tr");

            row.className =
                "folder";

            /*
                Name
            */

            const nameCell =
                document.createElement("td");

            nameCell.appendChild(
                document.createTextNode(
                    "📁 "
                )
            );

            const link =
                document.createElement("a");

            link.href = "#";

            link.innerText =
                folderName + "/";

            link.onclick =
                function(event) {

                    event.preventDefault();

                    openFolder(
                        folderName
                    );

                };

            nameCell.appendChild(
                link
            );

            row.appendChild(
                nameCell
            );

            /*
                Size
            */

            const sizeCell =
                document.createElement("td");

            sizeCell.innerText =
                "-";

            row.appendChild(
                sizeCell
            );

            /*
                Type
            */

            const typeCell =
                document.createElement("td");

            typeCell.innerText =
                "Folder";

            row.appendChild(
                typeCell
            );

            /*
                Actions
            */

            const actionCell =
                document.createElement("td");

            actionCell.innerText =
                "-";

            row.appendChild(
                actionCell
            );

            table.appendChild(
                row
            );

        });

    /*
        FILES
    */

    files

        .sort((a, b) =>
            a.name.localeCompare(
                b.name
            )
        )

        .forEach(file => {

            table.appendChild(
                createFileRow(file)
            );

        });

    fileArea.appendChild(
        table
    );

}

/*
    CREATE TABLE
*/

function createTable() {

    const table =
        document.createElement("table");

    const header =
        document.createElement("tr");

    const headings = [
        ["Name", "name"],
        ["Size", "size"],
        ["Type", "type"],
        ["Actions", "actions"]
    ];

    headings.forEach(item => {

        const th =
            document.createElement("th");

        th.innerText =
            item[0];

        th.className =
            item[1];

        header.appendChild(
            th
        );

    });

    table.appendChild(
        header
    );

    return table;

}

/*
    CREATE FILE ROW
*/

function createFileRow(file) {

    const row =
        document.createElement("tr");

    const parts =
        file.name.split("/");

    const filename =
        parts[
            parts.length - 1
        ];

    const extension =
        filename
            .split(".")
            .pop()
            .toLowerCase();

    /*
        File icon / type
    */

    let icon = "📄";

    let type = "File";

    if (extension === "mp3") {

        icon = "🎵";

        type = "MP3";

    }

    else if (extension === "mp4") {

        icon = "🎬";

        type = "MP4";

    }

    else if (extension === "flp") {

        icon = "🎹";

        type = "FLP";

    }

    else if (extension === "zip") {

        icon = "📦";

        type = "ZIP";

    }

    /*
        NAME CELL
    */

    const nameCell =
        document.createElement("td");

    nameCell.appendChild(
        document.createTextNode(
            icon + " "
        )
    );

    const fileLink =
        document.createElement("a");

    fileLink.href =
        file.url;

    fileLink.target =
        "_blank";

    /*
        Use D1 title if available.
        Otherwise use filename.
    */

    fileLink.innerText =
        file.title ||
        filename;

    nameCell.appendChild(
        fileLink
    );

    /*
        Extra D1 information
    */

    const information =
        [];

    if (file.creator) {

        information.push(
            "Creator: " +
            file.creator
        );

    }

    if (file.year) {

        information.push(
            "Year: " +
            file.year
        );

    }

    if (file.tags) {

        information.push(
            "Tags: " +
            file.tags
        );

    }

    if (information.length > 0) {

        const info =
            document.createElement(
                "div"
            );

        info.className =
            "file-info";

        info.innerText =
            information.join(
                " | "
            );

        nameCell.appendChild(
            info
        );

    }

    /*
        Description
    */

    if (file.description) {

        const description =
            document.createElement(
                "div"
            );

        description.className =
            "file-info";

        description.innerText =
            file.description;

        nameCell.appendChild(
            description
        );

    }

    row.appendChild(
        nameCell
    );

    /*
        SIZE
    */

    const sizeCell =
        document.createElement("td");

    sizeCell.innerText =
        file.size;

    row.appendChild(
        sizeCell
    );

    /*
        TYPE / CATEGORY
    */

    const typeCell =
        document.createElement("td");

    typeCell.innerText =
        file.category ||
        type;

    row.appendChild(
        typeCell
    );

    /*
        ACTIONS
    */

    const actionCell =
        document.createElement("td");

    if (
        extension === "mp3" ||
        extension === "mp4"
    ) {

        const play =
            document.createElement("a");

        play.href =
            "player.html?file=" +
            encodeURIComponent(
                file.url
            );

        play.innerText =
            "Play";

        actionCell.appendChild(
            play
        );

        actionCell.appendChild(
            document.createTextNode(
                " "
            )
        );

    }

    const download =
        document.createElement("a");

    download.href =
        file.url;

    download.target =
        "_blank";

    download.innerText =
        "Download";

    actionCell.appendChild(
        download
    );

    row.appendChild(
        actionCell
    );

    return row;

}

/*
    SEARCH
*/

function searchFiles() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    if (search === "") {

        showFolder(
            currentPath
        );

        return;

    }

    /*
        Search through ALL metadata
    */

    const matchingFiles =
        allFiles.filter(file => {

            /*
                Do not show R2 folder-marker objects
                as search results. R2 folder markers
                have names ending in "/" and are
                commonly 0-byte objects.
            */

            if (
                !file.name ||
                file.name.trim().endsWith("/")
            ) {
                return false;
            }

            const searchableText = [

                file.name,

                file.title,

                file.creator,

                file.description,

                file.tags,

                file.year,

                file.category

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

            return searchableText.includes(
                search
            );

        });

    pathDisplay.innerText =
        '/ Search Results for "' +
        searchInput.value.trim() +
        '"';

    back.style.display =
        "none";

    fileArea.innerHTML =
        "";

    searchInfo.innerText =
        matchingFiles.length +
        " matching file(s) found.";

    displaySearchResults(
        matchingFiles
    );

}

/*
    DISPLAY SEARCH RESULTS
*/

function displaySearchResults(
    files
) {

    if (files.length === 0) {

        fileArea.innerHTML =
            '<div class="empty">' +
            'No files found.' +
            '</div>';

        return;

    }

    const table =
        createTable();

    files

        .sort((a, b) =>
            a.name.localeCompare(
                b.name
            )
        )

        .forEach(file => {

            table.appendChild(
                createFileRow(file)
            );

        });

    fileArea.appendChild(
        table
    );

}

/*
    OPEN FOLDER
*/

function openFolder(folder) {

    showFolder(
        currentPath +
        folder +
        "/"
    );

}

/*
    PARENT DIRECTORY
*/

function goBack() {

    if (currentPath === "") {

        return;

    }

    let parts =
        currentPath
            .split("/")
            .filter(Boolean);

    parts.pop();

    let newPath =
        parts.join("/");

    if (newPath !== "") {

        newPath += "/";

    }

    showFolder(
        newPath
    );

}

/*
    CLEAR SEARCH
*/

function clearSearch() {

    searchInput.value =
        "";

    searchInfo.innerText =
        "";

    showFolder(
        currentPath
    );

}

/*
    ENTER KEY SEARCH
*/

searchInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchFiles();

        }

    }
);

</script>

</body>

</html>
