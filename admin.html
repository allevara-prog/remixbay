<head>

<title>RemixBay // Admin</title>



<style>



/* ==============================

   UPLOAD WINDOW

   ============================== */



.upload-overlay {

/* ==============================

   MAIN WINDOW

   ============================== */



.window {

}





/* ==============================

   TITLE BAR

   ============================== */

/* ==============================

button {

/* ==============================

    <!-- MENU -->



<div class="menu">

</div>

<!-- ==========================
     UPLOAD DIALOG
     ========================== -->

<div id="uploadOverlay" class="upload-overlay">

    <div class="upload-window">

        <div class="upload-titlebar">
            <span>UPLOAD FILE</span>

            <button
                type="button"
                class="close-button"
                onclick="closeUpload()">
                X
            </button>
        </div>

        <div class="upload-content">

            <div class="field">
                <label for="uploadFile">File:</label>

                <input
                    type="file"
                    id="uploadFile">
            </div>

            <div class="field">
                <label for="uploadFolder">R2 Folder:</label>

                <input
                    type="text"
                    id="uploadFolder"
                    placeholder="remixes">

                <div class="help">
                    Examples: remixes, flps, flps/aiza hayes
                </div>
            </div>

            <div
                id="uploadDestination"
                class="upload-destination">
                DESTINATION: /
            </div>

            <div class="upload-buttons">

                <button
                    type="button"
                    onclick="closeUpload()">
                    Cancel
                </button>

                <button
                    type="button"
                    id="uploadButton"
                    onclick="uploadFile()">
                    Upload
                </button>

<script>

/*

    ========================================

    UPLOAD

    ========================================

*/





const uploadOverlay =

    document.getElementById(

        "uploadOverlay"

    );





const uploadFileInput =

    document.getElementById(

        "uploadFile"

    );





const uploadFolderInput =

    document.getElementById(

        "uploadFolder"

    );





const uploadButton =

    document.getElementById(

        "uploadButton"

    );





const uploadDestination =

    document.getElementById(

        "uploadDestination"

    );







/*

    OPEN WINDOW

*/





function openUpload() {





    uploadOverlay.style.display =

        "flex";





    uploadFileInput.value =

        "";





    uploadFolderInput.value =

        "";





    updateUploadDestination();





    uploadFileInput.focus();





}







/*

    CLOSE WINDOW

*/





function closeUpload() {





    uploadOverlay.style.display =

        "none";





}







/*

    SHOW DESTINATION

*/





function updateUploadDestination() {





    const file =

        uploadFileInput.files[0];





    let folder =

        uploadFolderInput.value

            .trim()

            .replace(/^\/+/, "")

            .replace(/\/+$/, "");





    let destination =

        "/";





    if (folder !== "") {



        destination +=

            folder +

            "/";



    }





    if (file) {



        destination +=

            file.name;



    }





    uploadDestination.innerText =

        "DESTINATION: " +

        destination;





}







uploadFileInput.addEventListener(

    "change",

    updateUploadDestination

);





uploadFolderInput.addEventListener(

    "input",

    updateUploadDestination

);







/*

    UPLOAD FILE

*/





async function uploadFile() {





    const file =

        uploadFileInput.files[0];





    if (!file) {





        setStatus(

            "SELECT A FILE TO UPLOAD",

            "error"

        );





        return;



    }







    const formData =

        new FormData();





    formData.append(

        "file",

        file

    );





    formData.append(

        "folder",

        uploadFolderInput.value.trim()

    );







    uploadButton.disabled =

        true;





    uploadButton.innerText =

        "Uploading...";





    setStatus(

        "UPLOADING..."

    );





    try {





        const response =

            await fetch(

                "/api/admin/upload",

                {



                    method:

                        "POST",



                    body:

                        formData



                }

            );







        /*

            Read response safely

        */





        const text =

            await response.text();





        let result = {};





        if (text) {





            try {





                result =

                    JSON.parse(text);





            }



            catch {





                throw new Error(

                    "Server returned an invalid response."

                );





            }





        }







        if (!response.ok) {





            throw new Error(



                result.message ||



                "Upload failed."



            );





        }







        /*

            Close upload window

        */





        closeUpload();







        /*

            Reload R2 + D1 list

        */





        await loadFiles();







        /*

            Find newly uploaded file

        */





        const newFile =

            allFiles.find(

                item =>

                    item.name ===

                    result.name

            );





        if (newFile) {





            /*

                Remove filters so

                new file is visible

            */





            searchInput.value =

                "";





            setFilter(

                "all"

            );





            const index =

                visibleFiles.findIndex(

                    item =>

                        item.name ===

                        newFile.name

                );





            selectFile(

                newFile,

                index

            );





        }







        setStatus(

            "UPLOAD COMPLETE",

            "success"

        );





    }



    catch (error) {





        setStatus(

            error.message.toUpperCase(),

            "error"

        );





    }







    uploadButton.disabled =

        false;





    uploadButton.innerText =

        "Upload";





}







/*

    CLOSE DIALOG WITH ESCAPE

*/





document.addEventListener(

    "keydown",

    function(event) {





        if (

            event.key === "Escape" &&

            uploadOverlay.style.display ===

            "flex"

        ) {





            closeUpload();





        }





    }

);



/*

    ========================================

    DATA

    ========================================

*/





let allFiles = [];



let visibleFiles = [];



let selectedFile = null;



let selectedIndex = -1;



let currentFilter = "all";



let originalMetadata = null;



let modified = false;







/*

    ========================================

    ELEMENTS

    ========================================

*/





const fileList =

    document.getElementById("fileList");





const searchInput =

    document.getElementById("search");





const emptyEditor =

    document.getElementById("emptyEditor");





const editorContent =

    document.getElementById("editorContent");





const titleInput =

    document.getElementById("title");





const creatorInput =

    document.getElementById("creator");





const tagsInput =

    document.getElementById("tags");





const descriptionInput =

    document.getElementById("description");





const yearInput =

    document.getElementById("year");





const categoryInput =

    document.getElementById("category");





const saveButton =

    document.getElementById("saveButton");





const revertButton =

    document.getElementById("revertButton");





const previousButton =

    document.getElementById("previousButton");





const nextButton =

    document.getElementById("nextButton");





const statusText =

    document.getElementById("status");





const stats =

    document.getElementById("stats");





const r2Path =

    document.getElementById("r2Path");





const r2Filename =

    document.getElementById("r2Filename");





const r2Size =

    document.getElementById("r2Size");





const r2Type =

    document.getElementById("r2Type");







/*

    ========================================

    LOAD FILES

    ========================================

*/





loadFiles();





async function loadFiles() {





    setStatus(

        "LOADING FILES..."

    );





    try {





        const response =

            await fetch(

                "/api/files"

            );





        if (!response.ok) {



            throw new Error(

                "Could not load files."

            );



        }





        allFiles =

            await response.json();







        /*

            Sort alphabetically

        */





        allFiles.sort(

            (a, b) =>

                a.name.localeCompare(

                    b.name

                )

        );





        updateStats();





        applyFilters();





        setStatus(

            "READY"

        );





    }



    catch (error) {





        fileList.innerHTML =

            '<div class="no-file">' +

            'Error loading files.' +

            '</div>';





        setStatus(

            error.message.toUpperCase(),

            "error"

        );





    }





}







/*

    ========================================

    FILE HAS METADATA?

    ========================================

*/





function hasMetadata(file) {





    return Boolean(



        file.title ||



        file.creator ||



        file.description ||



        file.tags ||



        file.year ||



        file.category



    );





}







/*

    ========================================

    UPDATE COUNTS

    ========================================

*/





function updateStats() {





    const catalogued =

        allFiles.filter(

            hasMetadata

        ).length;





    const uncatalogued =

        allFiles.length -

        catalogued;





    stats.innerText =



        allFiles.length +

        " FILES | " +



        catalogued +

        " CATALOGUED | " +



        uncatalogued +

        " UNCATALOGUED";





}







/*

    ========================================

    SEARCH / FILTER

    ========================================

*/





searchInput.addEventListener(

    "input",

    function() {



        applyFilters();



    }

);







function setFilter(filter) {





    currentFilter =

        filter;





    document

        .getElementById("filterAll")

        .classList.remove("active");





    document

        .getElementById("filterTagged")

        .classList.remove("active");





    document

        .getElementById("filterUntagged")

        .classList.remove("active");





    if (filter === "all") {



        document

            .getElementById("filterAll")

            .classList.add("active");



    }





    if (filter === "tagged") {



        document

            .getElementById("filterTagged")

            .classList.add("active");



    }





    if (filter === "untagged") {



        document

            .getElementById("filterUntagged")

            .classList.add("active");



    }





    applyFilters();





}







function applyFilters() {





    const search =

        searchInput.value

            .trim()

            .toLowerCase();





    visibleFiles =

        allFiles.filter(

            file => {





                /*

                    Filter by metadata

                */





                if (

                    currentFilter ===

                    "tagged" &&

                    !hasMetadata(file)

                ) {



                    return false;



                }





                if (

                    currentFilter ===

                    "untagged" &&

                    hasMetadata(file)

                ) {



                    return false;



                }







                /*

                    Search

                */





                if (search !== "") {





                    const text = [



                        file.name,



                        file.title,



                        file.creator,



                        file.tags,



                        file.description,



                        file.year,



                        file.category



                    ]

                    .filter(Boolean)

                    .join(" ")

                    .toLowerCase();





                    if (

                        !text.includes(

                            search

                        )

                    ) {



                        return false;



                    }



                }





                return true;





            }

        );





    renderFileList();





}







/*

    ========================================

    RENDER FILE LIST

    ========================================

*/





function renderFileList() {





    fileList.innerHTML =

        "";





    if (

        visibleFiles.length === 0

    ) {





        fileList.innerHTML =

            '<div class="no-file">' +

            'No files found.' +

            '</div>';





        return;



    }







    visibleFiles.forEach(

        (file, index) => {





            const item =

                document.createElement(

                    "div"

                );





            item.className =

                "file-item";





            if (

                selectedFile &&

                selectedFile.name ===

                file.name

            ) {



                item.classList.add(

                    "selected"

                );



            }







            /*

                Metadata dot

            */





            const dot =

                document.createElement(

                    "span"

                );





            dot.className =

                "metadata-dot " +

                (

                    hasMetadata(file)

                        ? "complete"

                        : "empty"

                );







            /*

                File name

            */





            const filename =

                getFilename(

                    file.name

                );





            const name =

                document.createElement(

                    "span"

                );





            name.className =

                "file-name";





            name.innerText =

                filename;







            /*

                Path

            */





            const path =

                document.createElement(

                    "div"

                );





            path.className =

                "file-path";





            path.innerText =

                file.name;







            item.appendChild(

                dot

            );





            item.appendChild(

                name

            );





            item.appendChild(

                path

            );





            item.onclick =

                function() {





                    selectFile(

                        file,

                        index

                    );





                };





            fileList.appendChild(

                item

            );





        }

    );





}







/*

    ========================================

    SELECT FILE

    ========================================

*/





function selectFile(

    file,

    index

) {





    /*

        Warn if there are

        unsaved changes

    */





    if (

        modified &&

        selectedFile &&

        selectedFile.name !==

        file.name

    ) {





        const leave =

            confirm(

                "You have unsaved changes.\n\n" +

                "Discard them and open another file?"

            );





        if (!leave) {



            return;



        }



    }







    selectedFile =

        file;





    selectedIndex =

        index;







    /*

        Store original metadata

    */





    originalMetadata = {



        title:

            file.title || "",



        creator:

            file.creator || "",



        tags:

            file.tags || "",



        description:

            file.description || "",



        year:

            file.year || "",



        category:

            file.category || ""



    };







    /*

        Fill editor

    */





    titleInput.value =

        originalMetadata.title;





    creatorInput.value =

        originalMetadata.creator;





    tagsInput.value =

        originalMetadata.tags;





    descriptionInput.value =

        originalMetadata.description;





    yearInput.value =

        originalMetadata.year;





    setCategoryValue(

        originalMetadata.category

    );







    /*

        R2 info

    */





    r2Path.innerText =

        file.name;





    r2Filename.innerText =

        getFilename(

            file.name

        );





    r2Size.innerText =

        file.size;





    r2Type.innerText =

        getExtension(

            file.name

        ).toUpperCase() ||

        "FILE";







    emptyEditor.style.display =

        "none";





    editorContent.style.display =

        "block";





    modified =

        false;





    updateNavigationButtons();





    renderFileList();





    setStatus(

        "FILE LOADED"

    );





}







/*

    ========================================

    CATEGORY

    ========================================

*/





function setCategoryValue(

    value

) {





    /*

        If the database contains a category

        not currently in the dropdown,

        temporarily add it.

    */





    if (

        value !== "" &&

        !Array.from(

            categoryInput.options

        ).some(

            option =>

                option.value === value

        )

    ) {





        const option =

            document.createElement(

                "option"

            );





        option.value =

            value;





        option.innerText =

            value;





        categoryInput.appendChild(

            option

        );





    }





    categoryInput.value =

        value;





}







/*

    ========================================

    MODIFIED DETECTION

    ========================================

*/





const editableFields = [



    titleInput,

    creatorInput,

    tagsInput,

    descriptionInput,

    yearInput,

    categoryInput



];





editableFields.forEach(

    field => {





        field.addEventListener(

            "input",

            checkModified

        );





        field.addEventListener(

            "change",

            checkModified

        );





    }

);







function checkModified() {





    if (

        !selectedFile ||

        !originalMetadata

    ) {



        return;



    }





    modified =



        titleInput.value !==

        String(

            originalMetadata.title

        )



        ||



        creatorInput.value !==

        String(

            originalMetadata.creator

        )



        ||



        tagsInput.value !==

        String(

            originalMetadata.tags

        )



        ||



        descriptionInput.value !==

        String(

            originalMetadata.description

        )



        ||



        yearInput.value !==

        String(

            originalMetadata.year

        )



        ||



        categoryInput.value !==

        String(

            originalMetadata.category

        );





    if (modified) {





        setStatus(

            "MODIFIED",

            "modified"

        );





    }



    else {





        setStatus(

            "READY"

        );





    }





}







/*

    ========================================

    REVERT

    ========================================

*/





function revertChanges() {





    if (

        !selectedFile ||

        !originalMetadata

    ) {



        return;



    }





    titleInput.value =

        originalMetadata.title;





    creatorInput.value =

        originalMetadata.creator;





    tagsInput.value =

        originalMetadata.tags;





    descriptionInput.value =

        originalMetadata.description;





    yearInput.value =

        originalMetadata.year;





    setCategoryValue(

        originalMetadata.category

    );





    modified =

        false;





    setStatus(

        "CHANGES REVERTED"

    );





}







/*

    ========================================

    PREVIOUS / NEXT

    ========================================

*/





function previousFile() {





    if (

        selectedIndex <= 0

    ) {



        return;



    }





    selectFile(

        visibleFiles[

            selectedIndex - 1

        ],

        selectedIndex - 1

    );





}







function nextFile() {





    if (

        selectedIndex < 0 ||

        selectedIndex >=

        visibleFiles.length - 1

    ) {



        return;



    }





    selectFile(

        visibleFiles[

            selectedIndex + 1

        ],

        selectedIndex + 1

    );





}







function updateNavigationButtons() {





    previousButton.disabled =

        selectedIndex <= 0;





    nextButton.disabled =



        selectedIndex < 0 ||



        selectedIndex >=

        visibleFiles.length - 1;





}







/*

    ========================================

    SAVE METADATA

    ========================================

*/





async function saveMetadata() {





    if (!selectedFile) {





        setStatus(

            "SELECT A FILE",

            "error"

        );





        return;



    }







    saveButton.disabled =

        true;





    saveButton.innerText =

        "Saving...";





    setStatus(

        "SAVING..."

    );





    try {





        const response =

            await fetch(

                "/api/admin/save",

                {



                    method:

                        "POST",



                    headers: {



                        "Content-Type":

                            "application/json"



                    },



                    body:

                        JSON.stringify({



                            r2_key:

                                selectedFile.name,



                            title:

                                titleInput.value.trim(),



                            creator:

                                creatorInput.value.trim(),



                            tags:

                                tagsInput.value.trim(),



                            description:

                                descriptionInput.value.trim(),



                            year:

                                yearInput.value,



                            category:

                                categoryInput.value



                        })



                }

            );







        /*

            Read response safely

        */





        const text =

            await response.text();





        let result = {};





        if (text) {





            try {



                result =

                    JSON.parse(text);



            }



            catch {



                throw new Error(

                    "Server returned an invalid response."

                );



            }





        }







        if (!response.ok) {





            throw new Error(



                result.message ||



                "Could not save metadata."



            );





        }







        /*

            Update local file object

        */





        selectedFile.title =

            titleInput.value.trim();





        selectedFile.creator =

            creatorInput.value.trim();





        selectedFile.tags =

            tagsInput.value.trim();





        selectedFile.description =

            descriptionInput.value.trim();





        selectedFile.year =

            yearInput.value;





        selectedFile.category =

            categoryInput.value;







        /*

            Save new original values

        */





        originalMetadata = {



            title:

                selectedFile.title,



            creator:

                selectedFile.creator,



            tags:

                selectedFile.tags,



            description:

                selectedFile.description,



            year:

                selectedFile.year,



            category:

                selectedFile.category



        };





        modified =

            false;





        updateStats();





        applyFilters();





        setStatus(

            "METADATA SAVED",

            "success"

        );





    }



    catch (error) {





        setStatus(

            error.message.toUpperCase(),

            "error"

        );





    }





    saveButton.disabled =

        false;





    saveButton.innerText =

        "Save Metadata";





}







/*

    ========================================

    HELPERS

    ========================================

*/





function getFilename(path) {





    const parts =

        path.split("/");





    return parts[

        parts.length - 1

    ];





}







function getExtension(path) {





    const filename =

        getFilename(path);





    if (

        !filename.includes(".")

    ) {



        return "";



    }





    return filename

        .split(".")

        .pop();





}







/*

    ========================================

    STATUS

    ========================================

*/





function setStatus(

    message,

    type = ""

) {





    statusText.innerText =

        message;





    statusText.className =

        "";





    if (

        type === "success"

    ) {



        statusText.className =

            "status-success";



    }





    if (

        type === "error"

    ) {



        statusText.className =

            "status-error";



    }





    if (

        type === "modified"

    ) {



        statusText.className =

            "status-modified";



    }





}







/*

    ========================================

    WARN BEFORE LEAVING PAGE

    ========================================

*/





window.addEventListener(

    "beforeunload",

    function(event) {





        if (!modified) {



            return;



        }





        event.preventDefault();





        event.returnValue =

            "";





    }

);

</script>
